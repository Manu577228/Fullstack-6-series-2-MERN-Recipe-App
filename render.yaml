services:
  - type: keyvalue
    name: manu-recipe-cache
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: manu-recipe-api
    runtime: node
    rootDir: recipe-app-backend
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: manu-recipe-cache
          property: connectionString

  - type: web
    name: manu-recipe-app
    runtime: static
    rootDir: recipe-app-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
